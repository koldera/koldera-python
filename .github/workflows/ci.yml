name: CI

# The lean per-change gate: one job on the oldest supported runtime plus a newest-runtime test step.
# The wide compatibility matrix lives in matrix.yml and runs only for release tags (release.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - run: node scripts/check-source-hygiene.mjs
      - run: node --test scripts/check-source-hygiene.test.mjs
      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          # The gitleaks-action wrapper needs a paid licence for organisations; the plain binary does not.
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secrets in the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Secrets in the git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: Licences of the runtime dependencies are on the allow-list
        run: uv run --frozen python scripts/check_licences.py
      - name: Vendored contracts equal sdk-contract-kit at contracts/KIT_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < contracts/KIT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/KIT_VERSION must hold a 40-character commit id"; exit 1; }
          kit="$RUNNER_TEMP/kit"
          expected="$RUNNER_TEMP/expected-contracts"
          mkdir -p "$kit" "$expected"

          # Public repositories can be read without a token; once sdk-contract-kit is public the check is mandatory.
          public=false
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' https://api.github.com/repos/koldera/sdk-contract-kit)" = "200" ]; then public=true; fi

          auth=()
          if ! $public; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          code="$(curl -sSL -o "$kit.tar.gz" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/koldera/sdk-contract-kit/tarball/$sha")"
          if [ "$code" != "200" ]; then
            echo "fetching sdk-contract-kit at $sha returned HTTP $code"
            if $public; then
              echo "::error::sdk-contract-kit is public but $sha could not be fetched"
              exit 1
            fi
            echo "::notice title=Contract check skipped::sdk-contract-kit is private and not readable with this workflow token. The check is enforced once the repository is public."
            exit 0
          fi

          # contracts/ must be an exact mirror of the kit at that commit (scripts/sync-to-sdk.mjs in sdk-contract-kit).
          tar -xzf "$kit.tar.gz" -C "$kit" --strip-components=1
          cp -R "$kit/openapi.yaml" "$kit/document.schema.json" "$kit/problem.schema.json" "$kit/CORE_VERSION" "$kit/golden" "$expected/"
          printf '%s\n' "$sha" > "$expected/KIT_VERSION"
          if ! diff -ru "$expected" contracts; then
            echo "::error::contracts/ differs from sdk-contract-kit at $sha; re-run scripts/sync-to-sdk.mjs from the kit"
            exit 1
          fi
      - run: uv run --frozen pdoc --docformat google koldera -o site
      - name: The API reference was generated
        run: test -s site/koldera.html && test -s site/index.html
      - run: uv build
      - name: Distribution metadata is valid (what PyPI checks at upload)
        run: uv run --frozen twine check --strict dist/*
      - name: Distribution contents
        run: uv run --frozen python scripts/check_dist.py dist
      - name: The wheel installs into a clean environment and imports
        run: |
          uv venv --python 3.10 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -c "import koldera; print(koldera.__version__)"
      - name: Upload dry run
        run: uv publish --dry-run dist/*
      - name: Tests on the newest Python (the full matrix runs at release)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-newest
        run: uv run --frozen --python 3.14 pytest
